name: Dynamic Time State Sync

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs every 6 hours
  workflow_dispatch:       # Allows manual trigger via web UI

permissions:
  contents: write

jobs:
  update-anchor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Chronological State
        run: |
          mkdir -p state
          python3 -c "
          from datetime import datetime, timezone
          import json, os

          now = datetime.now(timezone.utc)
          state = {
              'utc_iso': now.isoformat(),
              'unix_epoch': int(now.timestamp()),
              'calendar': {
                  'year': now.year,
                  'month': now.month,
                  'day': now.day,
                  'hour': now.hour,
                  'minute': now.minute,
                  'second': now.second,
                  'day_of_week': now.strftime('%A'),
                  'day_of_year': int(now.strftime('%j')),
                  'week_number': int(now.strftime('%V'))
              },
              'leap_year': (now.year % 4 == 0 and now.year % 100 != 0) or (now.year % 400 == 0),
              'synchronized_at': now.isoformat()
          }

          with open('state/current_anchor.json', 'w') as f:
              json.dump(state, f, indent=2)
          "

      - name: Commit and Push State
        run: |
          git config --global user.name "time-agent-bot[bot]"
          git config --global user.email "time-agent-bot@users.noreply.github.com"
          git add state/current_anchor.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: sync world time anchor state [skip ci]" && git push)
